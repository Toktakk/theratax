services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: theratax
      POSTGRES_PASSWORD: theratax
      POSTGRES_DB: theratax_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: theratax
      MINIO_ROOT_PASSWORD: theratax-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
